[package]
name = "omadesign-libraw"
version = "0.6.8"
edition = "2024"
license = "MIT"
description = "Vendored LibRaw 0.22.2 bridge for Omadesign"
publish = false
links = "omadesign_raw"

[dependencies]
libz-sys = { version = "1.1", features = ["static"] }
mozjpeg-sys = { version = "2.2.3", default-features = false, features = ["unwinding"] }

[build-dependencies]
cc = { version = "1", features = ["parallel"] }
flate2 = "1"
tar = "0.4"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
