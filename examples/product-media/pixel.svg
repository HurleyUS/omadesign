<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#f4f1e8"/><g fill="#153d34" font-family="Liberation Sans"><text x="64" y="75" font-size="23" letter-spacing="5">FIELDWORK / BRUSH STUDIES</text><text x="64" y="160" font-size="64" font-weight="700">Every mark has a shape.</text><text x="64" y="250" font-size="21">01 / Round</text><text x="454" y="250" font-size="21">02 / Soft</text><text x="844" y="250" font-size="21">03 / Flat</text><text x="1234" y="250" font-size="21">04 / Calligraphy</text><text x="64" y="435" font-size="21">05 / Pencil</text><text x="454" y="435" font-size="21">06 / Dry ink</text><text x="844" y="435" font-size="21">07 / Square</text><text x="1234" y="435" font-size="21">08 / Chalk</text><text x="64" y="620" font-size="21">09 / Charcoal</text><text x="454" y="620" font-size="21">10 / Grain</text><text x="844" y="620" font-size="21">11 / Stipple</text><text x="1234" y="620" font-size="21">12 / Wash</text><text x="64" y="805" font-size="21">13 / Spatter</text></g></svg>