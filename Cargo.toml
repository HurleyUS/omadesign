[workspace]
# The application crate stays at the root. Native bridges live in their own
# crates so their C/C++ builds cache independently of app edits (#486).
# vendor/affinity joins as a path dependency of the app; the patched upstream
# crates in vendor/ (eframe, egui-winit, winit, resvg, usvg) are not members.
members = [".", "crates/omadesign-lcms", "crates/omadesign-libraw"]
exclude = ["vendor"]
resolver = "3"

[package]
name = "omadesign"
version = "0.6.8"
edition = "2024"
description = "Native Linux studio for design, layout, painting, photography, and motion"
license = "MIT"
homepage = "https://omadesign.app"
repository = "https://github.com/michaelmonetized/omadesign"

[lib]
name = "omadesign"
path = "src/lib.rs"

[[bin]]
name = "omadesign"
path = "src/main.rs"

[[bin]]
name = "gen_media"
path = "src/bin/gen_media.rs"

[features]
oma-ui-egui032 = []

[dependencies]
bytemuck = "1.25"
omadesign-affinity = { path = "vendor/affinity" }
omadesign-lcms = { path = "crates/omadesign-lcms" }
omadesign-libraw = { path = "crates/omadesign-libraw" }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"] }
sha2 = "0.10"
tiff = "0.11.3"
png = "0.18"
zstd = "0.13"
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"] }
ab_glyph = "0.2.32"
base64 = "0.22"
eframe = "0.36.1"
geo = "0.33.1"
ureq = { version = "2.10", features = ["tls"] }
url = "2.5"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "bmp",
    "gif",
    "tiff",
] }
rayon = "1.10"
rustybuzz = "0.20"
subsetter = { version = "=0.2.6", default-features = false, features = ["variable-fonts"] }
unicode-linebreak = "0.1"
hyphenation = { version = "0.8.4", features = ["embed_en-us"] }
unicode-segmentation = "1.13"
unicode-bidi = "0.3"
rfd = "0.15"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
semver = "1"
tiny-skia = "0.12.0"
flate2 = "1"
roxmltree = "0.21"
simplecss = "0.2"
usvg = "0.47"
resvg = "0.47"
lopdf = { version = "0.44", default-features = false }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }

arboard = "3.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9.3"
x11-clipboard = "0.9.3"
x11rb = "0.13.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }


[dev-dependencies]
omadesign-affinity = { path = "vendor/affinity", features = ["synth"] }


# winit 0.30 only emits PinchGesture on macOS/iOS. This tree adds Wayland
# zwp_pointer_gestures_v1 so a trackpad pinch zooms the canvas.
[patch.crates-io]
resvg = { path = "vendor/resvg" }
usvg = { path = "vendor/usvg" }
# Wait for Wayland frame callbacks instead of polling occluded windows.
eframe = { path = "vendor/eframe" }
# Retain native clipboard key presses for modifier-aware application shortcuts.
egui-winit = { path = "vendor/egui-winit" }
winit = { path = "vendor/winit" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

# Line tables keep panics/backtraces readable while cutting clean builds ~15%,
# core rebuilds ~19% and the target dir ~44% (#486 audit, 8.8 GB -> 4.9 GB).
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# The application crate has no unsafe code. It lives only in the FFI bridge
# crates (crates/omadesign-lcms, crates/omadesign-libraw), where every block
# carries a `// SAFETY:` comment (#486).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
